# Install as /etc/nginx/sites-available/akademiproduk.conf and symlink it.
# TLS certificate paths are intentionally environment-owned and not committed here.

map $http_host $lms_robots_header {
    default "";
    membership.akademiproduk.com "noindex, nofollow, noarchive";
    dashboard58.akademiproduk.com "noindex, nofollow, noarchive";
}

server {
    listen 80;
    server_name akademiproduk.com membership.akademiproduk.com dashboard58.akademiproduk.com;
    # Replace with the managed TLS/Cloudflare origin certificate server block before live enablement.
    location /api/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag $lms_robots_header always;
    }
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Robots-Tag $lms_robots_header always;
    }
}
