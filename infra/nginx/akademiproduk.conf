server {
    listen 80;
    server_name akademiproduk.com membership.akademiproduk.com dashboard58.akademiproduk.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name akademiproduk.com;
    ssl_certificate /etc/nginx/ssl/akademiproduk/origin.pem;
    ssl_certificate_key /etc/nginx/ssl/akademiproduk/origin.key;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:3201;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name membership.akademiproduk.com dashboard58.akademiproduk.com;
    ssl_certificate /etc/nginx/ssl/akademiproduk/origin.pem;
